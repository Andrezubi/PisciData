<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PisciData · Asistente IA</title>
<meta name="description" content="Chat de prueba del asistente PisciData (Qwen local + MCP + Backend).">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#06141f;--panel:#0d2536cc;--line:#1c4560;--teal:#2dd4bf;--blue:#38bdf8;--text:#e6f4f9;--mute:#7fa6b8}
  *{box-sizing:border-box;margin:0}
  body{font-family:Outfit,system-ui,sans-serif;color:var(--text);min-height:100vh;display:flex;justify-content:center;
    background:radial-gradient(900px 500px at 15% -10%,#0e4a63 0%,transparent 60%),radial-gradient(700px 500px at 100% 100%,#0b3d4a 0%,transparent 55%),var(--bg)}
  .app{width:min(820px,100%);height:100vh;display:flex;flex-direction:column;padding:20px;gap:14px}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(14px)}
  h1{font-size:1.15rem;font-weight:600;display:flex;gap:10px;align-items:center}
  h1 span.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--teal),var(--blue));color:#042; font-size:1.1rem}
  .badges{display:flex;gap:8px;flex-wrap:wrap}
  .badge{font-size:.72rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mute);display:flex;gap:6px;align-items:center}
  .dot{width:7px;height:7px;border-radius:50%;background:#64748b}.ok .dot{background:var(--teal);box-shadow:0 0 8px var(--teal)}.bad .dot{background:#f87171}
  #log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:6px 2px;scroll-behavior:smooth}
  .msg{max-width:82%;padding:12px 16px;border-radius:18px;line-height:1.5;white-space:pre-wrap;animation:in .25s ease}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .user{align-self:flex-end;background:linear-gradient(135deg,#0ea5a4,#0284c7);border-bottom-right-radius:6px}
  .bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px}
  details.tool{align-self:flex-start;max-width:82%;font-size:.78rem;color:var(--mute);border:1px dashed var(--line);border-radius:12px;padding:8px 12px;background:#0a1d2b99}
  details.tool summary{cursor:pointer;color:var(--teal)}
  details.tool pre{margin-top:8px;white-space:pre-wrap;word-break:break-all;max-height:160px;overflow:auto}
  .typing{display:inline-flex;gap:4px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1.1)}}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font:inherit;font-size:.8rem;color:var(--text);background:#0d2536;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;transition:.2s}
  .chip:hover{border-color:var(--teal);transform:translateY(-1px)}
  form{display:flex;gap:10px}
  input{flex:1;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;outline:none;transition:.2s}
  input:focus{border-color:var(--teal);box-shadow:0 0 0 3px #2dd4bf22}
  button.send{font:inherit;font-weight:600;border:0;border-radius:14px;padding:0 22px;color:#032;cursor:pointer;background:linear-gradient(135deg,var(--teal),var(--blue));transition:.2s}
  button.send:hover{filter:brightness(1.1);transform:translateY(-1px)}button.send:disabled{opacity:.5;cursor:wait}
</style>
</head>
<body>
<main class="app">
  <header>
    <h1><span class="logo">🐟</span> PisciData · Asistente</h1>
    <div class="badges">
      <div class="badge" id="b-llm"><i class="dot"></i>Qwen</div>
      <div class="badge" id="b-mcp"><i class="dot"></i>MCP</div>
      <div class="badge" id="b-tools">0 tools</div>
    </div>
  </header>
  <section id="log" aria-live="polite"></section>
  <div class="chips">
    <button class="chip">¿Qué granjas hay registradas?</button>
    <button class="chip">Lista los estanques</button>
    <button class="chip">Muéstrame los muestreos biométricos</button>
    <button class="chip">Detalle del ciclo productivo 1</button>
  </div>
  <form id="f">
    <input id="in" autocomplete="off" placeholder="Pregunta sobre tu piscigranja…" required>
    <button class="send" id="send">Enviar</button>
  </form>
</main>
<script>
const log=document.getElementById('log'),f=document.getElementById('f'),inp=document.getElementById('in'),btn=document.getElementById('send');
let sid=null;
const add=(cls,txt)=>{const d=document.createElement('div');d.className='msg '+cls;d.textContent=txt;log.append(d);log.scrollTop=log.scrollHeight;return d};
function tools(list){list.forEach(t=>{const d=document.createElement('details');d.className='tool';
  d.innerHTML=`<summary>🔧 ${t.name}(${t.arguments})</summary><pre></pre>`;d.querySelector('pre').textContent=t.result;log.append(d)})}
async function health(){try{const h=await (await fetch('/api/health')).json();
  b('b-llm',h.llm);b('b-mcp',h.mcp);document.getElementById('b-tools').textContent=h.tools.length+' tools'}catch{b('b-llm',false);b('b-mcp',false)}}
const b=(id,ok)=>document.getElementById(id).className='badge '+(ok?'ok':'bad');
async function send(text){
  add('user',text);btn.disabled=true;
  const w=add('bot','');w.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,sessionId:sid})});
    const j=await r.json();
    if(!r.ok){w.textContent='⚠️ '+(j.error||r.status);}
    else{sid=j.sessionId;w.remove();if(j.toolCalls?.length)tools(j.toolCalls);add('bot',j.reply||'(sin respuesta)')}
  }catch(e){w.textContent='⚠️ '+e.message}
  btn.disabled=false;inp.focus();log.scrollTop=log.scrollHeight;
}
f.onsubmit=e=>{e.preventDefault();const t=inp.value.trim();if(t){inp.value='';send(t)}};
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>send(c.textContent));
add('bot','¡Hola! Soy el asistente de PisciData. Consulto tu backend a través del servidor MCP. ¿Qué necesitas?');
health();setInterval(health,8000);
</script>
</body>
</html>
